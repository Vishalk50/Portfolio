services:
  - type: web
    name: portfolio-contact-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: vishalkhajuriya443@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: TO_EMAIL
        value: vishalkhajuriya443@gmail.com
